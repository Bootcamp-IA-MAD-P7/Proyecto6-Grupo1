<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sin conexión - Complaint Routing</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #f4f1e8;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        text-align: center;
        max-width: 400px;
        padding: 40px 30px;
        background: white;
        border-radius: 16px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      }

      .icon {
        font-size: 64px;
        margin-bottom: 20px;
        display: block;
      }

      h1 {
        font-size: 24px;
        color: #102925;
        margin-bottom: 12px;
      }

      p {
        color: #4a5568;
        line-height: 1.6;
        margin-bottom: 24px;
        font-size: 16px;
      }

      .btn {
        display: inline-block;
        padding: 12px 32px;
        background: #102925;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.3s;
      }

      .btn:hover {
        background: #1a3d35;
      }

      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .status {
        margin-top: 16px;
        font-size: 14px;
        color: #a0aec0;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <span class="icon">📡</span>
      <h1>Sin conexión a internet</h1>
      <p>
        No te preocupes, puedes seguir trabajando offline.<br />
        Tus clasificaciones se guardarán y sincronizarán automáticamente.
      </p>
      <button class="btn" id="reconnectBtn" onclick="checkConnection()">
        🔄 Intentar reconectar
      </button>
      <div class="status" id="status">Buscando conexión...</div>
    </div>

    <script>
      // Verificar conexión cada 5 segundos
      setInterval(checkConnection, 5000)

      async function checkConnection() {
        const btn = document.getElementById('reconnectBtn')
        const status = document.getElementById('status')

        btn.disabled = true
        btn.textContent = '⏳ Verificando...'
        status.textContent = 'Verificando conexión...'

        try {
          const response = await fetch('/api/health', {
            method: 'HEAD',
            cache: 'no-cache',
          })

          if (response.ok) {
            status.textContent = '✅ Conexión restablecida'
            btn.textContent = '🔄 Redirigiendo...'
            setTimeout(() => {
              window.location.href = '/'
            }, 1000)
          } else {
            throw new Error('API no disponible')
          }
        } catch (error) {
          btn.disabled = false
          btn.textContent = '🔄 Intentar reconectar'
          status.textContent = '⛔ Sin conexión'
        }
      }

      // Escuchar cambios de conexión
      window.addEventListener('online', () => {
        checkConnection()
      })

      window.addEventListener('offline', () => {
        document.getElementById('status').textContent = '⛔ Desconectado'
      })

      // Verificar al cargar
      document.addEventListener('DOMContentLoaded', checkConnection)
    </script>
  </body>
</html>
