<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline - ClaimVox</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #f4f1e8;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        text-align: center;
        max-width: 400px;
        padding: 40px 30px;
        background: white;
        border-radius: 16px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      }

      h1 {
        font-size: 24px;
        color: #102925;
        margin-bottom: 12px;
      }

      p {
        color: #4a5568;
        line-height: 1.6;
        margin-bottom: 24px;
        font-size: 16px;
      }

      .btn {
        display: inline-block;
        padding: 12px 32px;
        background: #102925;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.3s;
      }

      .btn:hover {
        background: #1a3d35;
      }

      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .status {
        margin-top: 16px;
        font-size: 14px;
        color: #a0aec0;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>You are offline</h1>
      <p>
        The application shell and this help page can remain available. Complaint classification
        requires a connection and no result, narrative or pending request is stored for later
        synchronization.
      </p>
      <button class="btn" id="reconnectBtn" type="button">Try again</button>
      <div class="status" id="status" role="status">Waiting for a connection.</div>
    </div>

    <script>
      function checkConnection() {
        const btn = document.getElementById('reconnectBtn')
        const status = document.getElementById('status')

        if (navigator.onLine) {
          btn.disabled = true
          status.textContent = 'Connection detected. Reloading the application…'
          window.location.reload()
        } else {
          btn.disabled = false
          status.textContent = 'Still offline. No request has been saved.'
        }
      }

      document.getElementById('reconnectBtn').addEventListener('click', checkConnection)
      window.addEventListener('online', checkConnection)
      window.addEventListener('offline', () => {
        document.getElementById('status').textContent =
          'Offline. Classification remains unavailable.'
      })
    </script>
  </body>
</html>
