name: Bug report
description: Report reproducible behaviour that contradicts the current contract.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behaviour
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Do not include credentials, private data or sensitive logs.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version, branch or commit
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Safe evidence
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I have removed credentials, private data and sensitive information.
          required: true
