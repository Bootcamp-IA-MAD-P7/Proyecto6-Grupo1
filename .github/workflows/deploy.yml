name: Deploy to EC2

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      recover_host:
        description: Reboot a stalled EC2 host before deployment
        required: false
        default: false
        type: boolean

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/dev'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/interface/package-lock.json

      - name: Build verified frontend artifact
        working-directory: app/interface
        run: |
          npm ci
          npm run typecheck
          npm run build:container

      - name: Prepare constrained EC2 host
        if: github.event_name == 'workflow_dispatch' && inputs.recover_host
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30s
          script: |
            set -eu
            sudo sh -c 'nohup sh -c "sleep 2; reboot" >/dev/null 2>&1 &'

      - name: Wait for EC2 reboot
        if: github.event_name == 'workflow_dispatch' && inputs.recover_host
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          sleep 20
          for attempt in $(seq 1 24); do
            if timeout 3 bash -c "</dev/tcp/${EC2_HOST}/22" 2>/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "EC2 did not accept SSH after reboot" >&2
          exit 1

      - name: Upload frontend artifact
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: app/interface/dist
          target: ~/Proyecto6-Grupo1
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          CLAIMVOX_DB_APP_PASSWORD: ${{ secrets.CLAIMVOX_DB_APP_PASSWORD }}
          APP_JWT_SECRET: ${{ secrets.APP_JWT_SECRET }}
          APP_DEMO_USERNAME: ${{ secrets.APP_DEMO_USERNAME }}
          APP_DEMO_PASSWORD: ${{ secrets.APP_DEMO_PASSWORD }}
          APP_DEMO_ROLE: ${{ secrets.APP_DEMO_ROLE }}
          APP_DEMO_NAME: ${{ secrets.APP_DEMO_NAME }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: POSTGRES_PASSWORD,CLAIMVOX_DB_APP_PASSWORD,APP_JWT_SECRET,APP_DEMO_USERNAME,APP_DEMO_PASSWORD,APP_DEMO_ROLE,APP_DEMO_NAME
          script: |
            set -eu
            cd ~/Proyecto6-Grupo1
            git fetch origin
            git checkout dev
            git pull --ff-only
            umask 077
            test -n "${POSTGRES_PASSWORD:-}"
            test -n "${CLAIMVOX_DB_APP_PASSWORD:-}"
            test -n "${APP_JWT_SECRET:-}"
            test -n "${APP_DEMO_USERNAME:-}"
            test -n "${APP_DEMO_PASSWORD:-}"
            cat > .env <<EOF
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            CLAIMVOX_DB_APP_PASSWORD=${CLAIMVOX_DB_APP_PASSWORD}
            APP_JWT_SECRET=${APP_JWT_SECRET}
            APP_DEMO_USERNAME=${APP_DEMO_USERNAME}
            APP_DEMO_PASSWORD=${APP_DEMO_PASSWORD}
            APP_DEMO_ROLE=${APP_DEMO_ROLE:-admin}
            APP_DEMO_NAME=${APP_DEMO_NAME:-ClaimVox reviewer}
            EOF
            chmod 600 .env
            test -f app/interface/dist/index.html
            docker compose -f docker-compose.yml -f docker-compose.deploy.yml config --quiet
            COMPOSE_PARALLEL_LIMIT=1 docker compose -f docker-compose.yml -f docker-compose.deploy.yml build
            docker compose -f docker-compose.yml -f docker-compose.deploy.yml up -d
            echo "Deploy complete. Checking health..."
            for attempt in 1 2 3 4 5 6; do
              if curl --fail --silent --show-error http://localhost/api/v1/health; then
                exit 0
              fi
              sleep 5
            done
            echo "Health check failed after 6 attempts" >&2
            exit 1
