name: Deploy to EC2

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/dev'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -eu
            cd ~/Proyecto6-Grupo1
            git fetch origin
            git checkout dev
            git pull --ff-only
            test -f .env
            docker compose config --quiet
            docker compose build
            docker compose up -d
            echo "Deploy complete. Checking health..."
            for attempt in 1 2 3 4 5 6; do
              if curl --fail --silent --show-error http://localhost/api/v1/health; then
                exit 0
              fi
              sleep 5
            done
            echo "Health check failed after 6 attempts" >&2
            exit 1
