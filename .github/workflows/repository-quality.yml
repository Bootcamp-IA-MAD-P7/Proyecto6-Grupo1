name: Repository quality

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENSPEC_TELEMETRY: "0"

concurrency:
  group: repository-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install repository tooling
        run: npm ci

      - name: Audit repository tooling
        run: npm audit --audit-level=high

      - name: Diagnose OpenSpec
        run: python scripts/harness.py doctor

      - name: Validate all OpenSpec artifacts
        run: npm run openspec:validate

      - name: Check repository conventions
        run: python scripts/quality/check_repository.py

