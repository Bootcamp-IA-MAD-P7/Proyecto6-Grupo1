<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">Estado de los veinticinco criterios del briefing</title>
  <desc id="desc">Cinco criterios verificados, seis en curso y catorce no iniciados, distribuidos entre los niveles esencial, medio, avanzado y experto.</desc>
  <defs>
    <style>
      .bg{fill:#f7f5ef}.title{font:700 28px system-ui,sans-serif;fill:#173f4f}.copy{font:400 15px system-ui,sans-serif;fill:#4b585e}
      .label{font:700 16px system-ui,sans-serif;fill:#173f4f}.count{font:700 17px system-ui,sans-serif;fill:#173f4f}
      .not{fill:#d9dee0}.doing{fill:#d5b56e}.done{fill:#52755b}.line{stroke:#fff;stroke-width:2}
    </style>
  </defs>
  <rect class="bg" width="1200" height="470" rx="24"/>
  <text class="title" x="70" y="68">Briefing convertido en 25 puertas verificables</text>
  <text class="copy" x="70" y="98">El color nunca sustituye al estado escrito — Fuente: delivery_levels.md — 28 jul 2026</text>

  <text class="label" x="70" y="168">Esencial</text>
  <rect class="done" x="240" y="143" width="327" height="38" rx="6"/>
  <rect class="doing" x="567" y="143" width="329" height="38" rx="6"/>
  <rect class="not" x="896" y="143" width="166" height="38" rx="6"/>
  <text class="count" x="1080" y="169">4 / 10</text>
  <text class="copy" x="240" y="204">4 verificados · 4 en curso · 2 no iniciados</text>

  <text class="label" x="70" y="254">Medio</text>
