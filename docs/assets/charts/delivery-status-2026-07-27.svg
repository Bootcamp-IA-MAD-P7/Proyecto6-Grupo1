  <rect class="not" x="568" y="229" width="494" height="38" rx="6"/>
  <text class="count" x="1080" y="255">1 / 5</text>
  <text class="copy" x="240" y="290">1 verificado · 1 en curso · 3 no iniciados</text>

  <text class="label" x="70" y="326">Avanzado</text>
  <rect class="doing" x="240" y="301" width="137" height="38" rx="6"/>
  <rect class="not" x="377" y="301" width="685" height="38" rx="6"/>
