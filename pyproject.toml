[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "proyecto6-grupo1"
version = "0.1.0"
description = "ClaimVox: governed multiclass classification support for financial complaints"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "jupytext>=1.19.5",
    "langdetect>=1.0.9",
    "matplotlib>=3.11.1",
    "nbconvert>=7.17.1",
    "nbstripout>=0.9.1",
    "numpy>=2.5.1",
    "polars>=1.43.0",
    "ruff>=0.16.0",
    "joblib>=1.5.0",
    "optuna>=4.0.0",
    "scikit-learn>=1.6.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.8.0",
    "httpx>=0.28.0",
    "PyJWT>=2.9.0",
    "psycopg2-binary>=2.9.0",
    "xgboost>=2.1.0",
    "lightgbm>=4.7.0",
]
